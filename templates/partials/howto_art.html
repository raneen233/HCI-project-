{% macro open_hand() %}
<g stroke="#8460d6" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" fill="#ece8fb">
  <rect x="70" y="20" width="16" height="64" rx="8"/>
  <rect x="92" y="8" width="17" height="74" rx="8.5"/>
  <rect x="115" y="14" width="16" height="68" rx="8"/>
  <rect x="137" y="30" width="14" height="52" rx="7"/>
  <rect x="40" y="62" width="16" height="48" rx="8" transform="rotate(-32 48 86)"/>
  <path d="M64 74H152V104C152 132 130 150 108 150C88 150 72 140 62 122L54 104Z"/>
</g>
<rect x="67" y="72" width="84" height="8" fill="#ece8fb"/>
{% endmacro %}

{% macro move_art() %}
<svg viewBox="0 0 360 160" role="img" aria-label="An open palm moving a cursor">
  <ellipse cx="190" cy="82" rx="60" ry="64" fill="#d9ebf8"/>
  <g transform="translate(108 6) scale(.82)">{{ open_hand() }}</g>
  <g fill="none" stroke="#6db3e8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 60c-9 6-12 20-5 32"/><path d="M71 68c-6 5-7 13-3 21"/>
    <path d="M54 104h13M54 104l5-5M54 104l5 5"/>
    <path d="M268 78h54M274 72l-6 6 6 6M316 72l6 6-6 6"/>
  </g>
  <circle cx="295" cy="44" r="16" fill="#fff" stroke="#8460d6" stroke-width="2.6"/>
  <circle cx="295" cy="44" r="5.5" fill="#8460d6"/>
</svg>
{% endmacro %}

{% macro pinch_art() %}
<svg viewBox="0 0 360 160" role="img" aria-label="A pinching hand drawing a line and selecting a color">
  <!-- soft backdrop -->
  <ellipse cx="160" cy="88" rx="76" ry="66" fill="#e6e0f8"/>

  <!-- drawn squiggle trailing from the pinch point -->
  <path d="M18 108c8-30 20 2 30-16s14 12 24-8 14 8 22 0" fill="none" stroke="#ef7f72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="94" cy="86" r="3.6" fill="#ef7f72"/>

  <!-- pinch sparks -->
  <path d="M100 74l-7-8M112 68l-1-10M90 88l-9-3" stroke="#f6c85f" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- hand -->
  <g transform="translate(0 -8)">
    <!-- raised fingers, slightly fanned -->
    <g stroke="#8460d6" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" fill="#ece8fb">
      <rect x="150" y="32" width="15" height="68" rx="7.5" transform="rotate(-4 157.5 100)"/>
      <rect x="168" y="40" width="15" height="60" rx="7.5" transform="rotate(1 175.5 100)"/>
      <rect x="186" y="54" width="14" height="46" rx="7" transform="rotate(3 193 100)"/>
    </g>
    <!-- index finger, then thumb in front of it, tips pinching -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 94Q128 78 113 92" stroke="#8460d6" stroke-width="18.5"/>
      <path d="M160 94Q128 78 113 92" stroke="#ece8fb" stroke-width="12"/>
      <path d="M160 126Q120 134 112 104" stroke="#8460d6" stroke-width="19.5"/>
      <path d="M160 126Q120 134 112 104" stroke="#ece8fb" stroke-width="13"/>
    </g>
    <!-- palm: fill hides the finger bases so they grow out of it -->
    <path d="M150 86H200C203 104 201 122 195 134C192 141 188 146 184 150H160C150 144 142 136 141 124C140 110 146 98 150 86Z" fill="#ece8fb"/>
    <!-- palm outline: right side, wrist, the web between thumb and index, and under the thumb -->
    <path d="M199 86C203 104 201 122 195 134C192 141 188 146 184 150M148 95C144 101 142 108 142 119M143.5 135C147 143 153 148 160 150" fill="none" stroke="#8460d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- palm detail -->
    <path d="M160 112c8 5 20 5 30 0" fill="none" stroke="#c9bdf0" stroke-width="2.4" stroke-linecap="round"/>
    <!-- cuff -->
    <rect x="155" y="146" width="34" height="14" rx="5" fill="#a98ae6" stroke="#8460d6" stroke-width="3.2" stroke-linejoin="round"/>
  </g>

  <!-- link from pinch to tool panel -->
  <path d="M214 62Q232 40 246 50" fill="none" stroke="#8460d6" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- tool / color panel -->
  <rect x="250" y="22" width="84" height="116" rx="12" fill="#f8e6b8" stroke="#ecd08a" stroke-width="2"/>
  <rect x="259" y="34" width="30" height="30" rx="8" fill="#ef7f72"/>
  <rect x="295" y="34" width="30" height="30" rx="8" fill="#6db3e8"/>
  <rect x="259" y="70" width="30" height="30" rx="8" fill="#f6c85f" stroke="#ecd08a" stroke-width="2"/>
  <rect x="295" y="70" width="30" height="30" rx="8" fill="#a98ae6"/>
  <rect x="259" y="108" width="66" height="18" rx="9" fill="#fff" stroke="#ecd08a" stroke-width="2"/>

  <!-- selected swatch -->
  <rect x="254.5" y="29.5" width="39" height="39" rx="11" fill="none" stroke="#8460d6" stroke-width="2.8"/>
  <circle cx="274" cy="49" r="5" fill="#fff"/>
  <path d="M300 22l4-8M308 20l1-9M292 24l-6-6" stroke="#f6c85f" stroke-width="2.4" stroke-linecap="round" fill="none"/>
</svg>
{% endmacro %}
